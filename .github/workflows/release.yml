name: 绿色版 Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '发布到哪个 tag（如 v1.1.2）。留空则只编译、不建 Release'
        required: false
        default: ''

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 MSYS2 / mingw64 gcc
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: mingw64 加进 PATH
        shell: pwsh
        run: '"C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8'

      - name: 装 Rust（gnu host）
        shell: pwsh
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: 算版本号
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}".Trim()
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          if ($tag -match '^v\d') {
            $ver = $tag -replace '^v', ''
            $src = "tag $tag"
          } else {
            $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
            $src = 'Cargo.toml'
            $tag = ''
          }
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "版本号 = $ver（来源：$src）"

      - name: cargo build --release
        env:
          ROG_BUILD_VERSION: ${{ steps.ver.outputs.version }}
        run: cargo build --release --locked

      - name: 校验二进制自报版本 == tag 版本
        shell: pwsh
        env:
          EXPECT: ${{ steps.ver.outputs.version }}
        run: |
          $exe = Join-Path (Get-Location) 'target\release\rog-mouse-ctl.exe'
          $outFile = Join-Path $env:RUNNER_TEMP 'ver.txt'
          $errFile = Join-Path $env:RUNNER_TEMP 'ver.err.txt'
          $proc = Start-Process -FilePath $exe -ArgumentList 'version' -WindowStyle Hidden -Wait -PassThru `
            -RedirectStandardOutput $outFile -RedirectStandardError $errFile
          $got = if (Test-Path $outFile) { (Get-Content $outFile -Raw).Trim() } else { '' }
          $expect = $env:EXPECT
          "二进制自报 = '$got'    期望版本 = '$expect'    exit = $($proc.ExitCode)"
          if (-not $got -and (Test-Path $errFile)) {
            "stderr: " + (Get-Content $errFile -Raw)
          }
          if ($got -ne $expect) {
            throw "版本号不一致：二进制说 '$got'，期望 '$expect' —— 检查 build.rs 的 ROG_APP_VERSION 有没有被 ROG_BUILD_VERSION 覆盖"
          }

      - name: 校验 PE 子系统必须是 GUI（防黑框回归）
        shell: pwsh
        run: |
          $exe = 'target\release\rog-mouse-ctl.exe'
          $b = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $sub = [BitConverter]::ToUInt16($b, $pe + 0x18 + 0x44)
          "size      = {0:N0} B" -f $b.Length
          "subsystem = $sub  (2 = WINDOWS_GUI, 3 = WINDOWS_CUI)"
          if ($sub -ne 2) {
            throw "子系统不是 GUI（$sub）—— 启动会闪黑框，需要的是 GUI 子系统"
          }

      - name: 汇总产物 + 算 sha256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\rog-mouse-ctl.exe dist\
          $h = (Get-FileHash dist\rog-mouse-ctl.exe -Algorithm SHA256).Hash.ToLower()
          "$h  rog-mouse-ctl.exe" | Out-File -FilePath dist\rog-mouse-ctl.exe.sha256 -Encoding ascii
          "sha256 = $h"
          Get-ChildItem dist | ForEach-Object { '{0}  {1:N0} B' -f $_.Name, $_.Length }

      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ github.ref_name }}-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

      - name: 建 / 更新 Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.tag }}".Trim()
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          $ver = $tag -replace '^v', ''
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $section = [regex]::Match($changelog, '(?ms)^## ' + [regex]::Escape($ver) + '\r?\n(.*?)(?=^## |\z)')
          if (-not $section.Success) { throw "Missing changelog for $ver" }
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText($notes, $section.Groups[1].Value.Trim(), [Text.UTF8Encoding]::new($false))
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            "Release $tag 已存在，只覆盖附件"
            gh release upload $tag dist\rog-mouse-ctl.exe dist\rog-mouse-ctl.exe.sha256 --clobber
          } else {
            "Release $tag 不存在，新建"
            gh release create $tag dist\rog-mouse-ctl.exe dist\rog-mouse-ctl.exe.sha256 `
              --title "R Battery $ver" --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publishing failed" }
          gh release view $tag --json tagName,assets | Out-File -FilePath release-info.json -Encoding utf8
          Get-Content release-info.json -Raw
