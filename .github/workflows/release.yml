name: 绿色版 Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '发布到哪个 tag（如 v1.1.2）。留空则只编译、不建 Release'
        required: false
        default: ''

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: 装 MSYS2 / mingw64 gcc
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: mingw64 加进 PATH
        shell: pwsh
        run: '"C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8'

      - name: 装 Rust（gnu host）
        shell: pwsh
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: 算版本号
        id: ver
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          $tag = ([string]$env:REQUESTED_TAG).Trim()
          if (-not $tag -and $env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME }
          $verified = ./tools/check-release.ps1 -Tag $tag -SourceOnly
          $ver = $verified.Version
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "版本号 = $ver；标签 = $tag"

      - name: 回归测试
        run: cargo test --release --locked

      - name: cargo build --release
        env:
          ROG_BUILD_VERSION: ${{ steps.ver.outputs.version }}
        run: cargo build --release --locked

      - name: 校验源码、标签、二进制与 PE 子系统
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          ./tools/check-release.ps1 -Tag $env:RELEASE_TAG | Format-List

      - name: 汇总产物 + 算 sha256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\rog-mouse-ctl.exe dist\
          $h = (Get-FileHash dist\rog-mouse-ctl.exe -Algorithm SHA256).Hash.ToLower()
          "$h  rog-mouse-ctl.exe" | Out-File -FilePath dist\rog-mouse-ctl.exe.sha256 -Encoding ascii
          "sha256 = $h"
          Get-ChildItem dist | ForEach-Object { '{0}  {1:N0} B' -f $_.Name, $_.Length }

      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ github.ref_name }}-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

      - name: 建 / 更新 Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          $ver = $tag -replace '^v', ''
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $section = [regex]::Match($changelog, '(?ms)^## ' + [regex]::Escape($ver) + '\r?\n(.*?)(?=^## |\z)')
          if (-not $section.Success) { throw "Missing changelog for $ver" }
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText($notes, $section.Groups[1].Value.Trim(), [Text.UTF8Encoding]::new($false))
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Published assets must not be overwritten."
          } else {
            "Release $tag 不存在，新建"
            gh release create $tag dist\rog-mouse-ctl.exe dist\rog-mouse-ctl.exe.sha256 `
              --verify-tag --title "R Battery $ver" --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publishing failed" }
          gh release view $tag --json tagName,assets | Out-File -FilePath release-info.json -Encoding utf8
          Get-Content release-info.json -Raw
