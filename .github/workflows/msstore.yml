name: MSIX 打包

# ─────────────────────────────── 触发方式 ───────────────────────────────
#   push tag v1.1.1     → 编译 + 打 msix / msixupload
#   workflow_dispatch   → 同上，可手填版本号
#
#   绿色版（单文件 exe）由 `release.yml` 单独负责发 Release —— 两个工作流各管一件事，
#   互不牵连：这里失败不影响绿色版发版，反之亦然。
#
# ─────────────────────── 商店自动发布是「按需开启」的 ───────────────────────
#   仓库 Variables 里没有 MSSTORE_PRODUCT_ID 时，本工作流只做打包，
#   完全不碰商店。首个版本必须手动上架（微软硬性规定），过审后再配上这个变量，
#   之后的 tag 就会自动提交到商店。
#
# ─────────────────────────── 需要配的 Secrets ───────────────────────────
#   Settings → Secrets and variables → Actions → Secrets
#     AZURE_AD_TENANT_ID              Entra ID 目录（租户）ID
#     AZURE_AD_APPLICATION_CLIENT_ID  应用注册的客户端 ID
#     AZURE_AD_APPLICATION_SECRET     客户端密码（生成时只显示一次）
#     SELLER_ID                       Partner Center → Account settings → Legal info
#
# ────────────────────────── 需要配的 Variables ──────────────────────────
#   Settings → Secrets and variables → Actions → Variables
#     MSSTORE_PRODUCT_ID              商店产品 ID（如 9NRC8HCD4BZ7）
#                                     **不配 = 不自动发布**，只打包
#     MSSTORE_PACKAGE_IDENTITY_NAME   可选，覆盖 msix/package.props.psd1 的 IdentityName
#     MSSTORE_PUBLISHER               可选，覆盖 Publisher（CN=<GUID> 那个）
#     MSSTORE_PUBLISHER_DISPLAY_NAME  可选，覆盖 PublisherDisplayName
#
# ─────────────────────────────── 本地等价命令 ───────────────────────────────
#   powershell -File msix\build-msix.ps1 -Verify -SkipInstalledVersionCheck
#   powershell -File msix\make-upload.ps1
#   powershell -File msix\publish.ps1            （本机有 msstore CLI 时）

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'MSIX 版本号（四段，如 1.1.2.0）。留空则按 tag 推导'
        required: false
        default: ''
      skip_tests:
        description: '跳过 cargo test'
        type: boolean
        default: false

# 只读即可：本工作流不再建 Release，产物走 run artifacts
permissions:
  contents: read

# 本工程用 gnu 目标 + 自带的 mingw 导入库（vendor/mingw-import-libs），
# 所以 runner 上必须装 gnu host 工具链，且链接器 gcc 要在 PATH 里。
env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
  MSSTORE_PACKAGE_IDENTITY_NAME: ${{ vars.MSSTORE_PACKAGE_IDENTITY_NAME }}
  MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
  MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}

concurrency:
  group: msix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ───────────────────────── 测试（并行，不挡打包） ─────────────────────────
  test:
    name: cargo test
    runs-on: windows-latest
    if: inputs.skip_tests != true
    steps:
      - uses: actions/checkout@v4

      - name: 装 MSYS2 / mingw64 gcc
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: mingw64 加进 PATH
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH
          gcc --version

      - name: 装 Rust（gnu host）
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustc -vV

      - uses: Swatinem/rust-cache@v2
        with:
          key: gnu-test

      - name: cargo test
        run: cargo test --all-targets

  # ────────────────────────── 打包 + 发 Release ──────────────────────────
  msix:
    name: 打包 MSIX / 发 Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 MSYS2 / mingw64 gcc
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: mingw64 加进 PATH
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH
          gcc --version

      - name: 装 Rust（gnu host）
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustc -vV

      - uses: Swatinem/rust-cache@v2
        with:
          key: gnu-release

      # ── 版本号：tag v1.1.1 → 1.1.1.0；没有 tag 就退回 Cargo.toml ──
      - name: 算版本号
        id: ver
        shell: pwsh
        run: |
          $tag = ''
          if ($env:GITHUB_REF -like 'refs/tags/*') { $tag = $env:GITHUB_REF -replace '^refs/tags/', '' }

          $v = "${{ inputs.version }}".Trim()
          $src = 'input'
          if (-not $v -and $tag) { $v = $tag -replace '^v', ''; $src = "tag $tag" }
          if (-not $v) {
            $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([0-9.]+)"').Matches[0].Groups[1].Value
            $src = 'Cargo.toml'
          }

          $p = @($v.Split('.') | Where-Object { $_ -ne '' })
          while ($p.Count -lt 3) { $p += '0' }
          $four = ($p[0..2] -join '.') + '.0'

          # 商店只收四段数字，且第一段必须 >= 1
          if ($four -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "版本号不合法：'$v' → $four" }
          if ($four -match '^0\.') { throw "版本号第一段不能为 0：$four（商店要求 >= 1.0.0.0）" }

          "version=$four" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "MSIX 版本 = $four（来源：$src）"

      - name: cargo build --release
        run: cargo build --release

      # makeappx 来自 Windows SDK，不在 PATH 里；找出来交给打包脚本
      - name: 定位 makeappx
        shell: pwsh
        run: |
          $mk = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter makeappx.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\makeappx\.exe$' } |
                Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mk) { throw '找不到 makeappx.exe —— runner 上没有 Windows SDK？' }
          Write-Host "makeappx: $($mk.FullName)"
          $mk.DirectoryName >> $env:GITHUB_PATH

      - name: 打 MSIX（含逐项自检）
        shell: pwsh
        run: ./msix/build-msix.ps1 -Version ${{ steps.ver.outputs.version }} -Verify -SkipInstalledVersionCheck

      - name: 打 msixupload（商店提交件）
        shell: pwsh
        run: ./msix/make-upload.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: 汇总产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "msix\AppPackages\*_${{ steps.ver.outputs.version }}_x64.msix" dist\
          Copy-Item "msix\AppPackages\*_${{ steps.ver.outputs.version }}_x64.msixupload" dist\
          Get-ChildItem dist | ForEach-Object { '{0}  {1:N0} B' -f $_.Name, $_.Length }

      - uses: actions/upload-artifact@v4
        with:
          name: msix-${{ steps.ver.outputs.version }}
          path: dist/*
          if-no-files-found: error

      # ─────────── 以下仅在配了 MSSTORE_PRODUCT_ID 时执行 ───────────
      - name: 装 Microsoft Store CLI
        if: vars.MSSTORE_PRODUCT_ID != ''
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: 配置商店凭据
        if: vars.MSSTORE_PRODUCT_ID != ''
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} `
            --sellerId ${{ secrets.SELLER_ID }} `
            --clientId ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }} `
            --clientSecret ${{ secrets.AZURE_AD_APPLICATION_SECRET }}

      - name: 上传并提交到商店
        if: vars.MSSTORE_PRODUCT_ID != ''
        shell: pwsh
        run: |
          $up = Get-ChildItem dist\*.msixupload | Select-Object -First 1
          if (-not $up) { throw 'dist 里没有 .msixupload，先确认上一步成功' }
          Write-Host "上传：$($up.FullName)"
          msstore publish $up.FullName -id ${{ vars.MSSTORE_PRODUCT_ID }}

      - name: 等待商店校验结果
        if: vars.MSSTORE_PRODUCT_ID != ''
        shell: pwsh
        timeout-minutes: 90
        # 校验要排队，超时不算失败 —— 结果到 Partner Center 看
        continue-on-error: true
        run: msstore submission poll ${{ vars.MSSTORE_PRODUCT_ID }}
