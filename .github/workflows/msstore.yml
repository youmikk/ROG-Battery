name: MSIX 打包

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'MSIX 版本号（四段，如 1.1.2.0）。留空则按 tag 推导'
        required: false
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
  MSSTORE_PACKAGE_IDENTITY_NAME: ${{ vars.MSSTORE_PACKAGE_IDENTITY_NAME }}
  MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
  MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}

concurrency:
  group: msix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  msix:
    name: 打包并提交 Microsoft Store
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 MSYS2 / mingw64 gcc
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: mingw64 加进 PATH
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH
          gcc --version

      - name: 装 Rust（gnu host）
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustc -vV

      - uses: Swatinem/rust-cache@v2
        with:
          key: gnu-release

      - name: 算版本号
        id: ver
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $tag = ''
          if ($env:GITHUB_REF -like 'refs/tags/*') { $tag = $env:GITHUB_REF -replace '^refs/tags/', '' }

          $v = ([string]$env:REQUESTED_VERSION).Trim()
          if ($v -and $v -notmatch '^\d+\.\d+\.\d+(\.0)?$') { throw 'Store versions must use X.Y.Z or X.Y.Z.0.' }
          $src = 'input'
          if (-not $v -and $tag) { $v = $tag -replace '^v', ''; $src = "tag $tag" }
          if (-not $v) {
            $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([0-9.]+)"').Matches[0].Groups[1].Value
            $src = 'Cargo.toml'
          }

          $p = @($v.Split('.') | Where-Object { $_ -ne '' })
          while ($p.Count -lt 3) { $p += '0' }
          $four = ($p[0..2] -join '.') + '.0'

          if ($four -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "版本号不合法：'$v' → $four" }
          $verified = ./tools/check-release.ps1 -Tag $tag -SourceOnly
          if ($four -ne $verified.StoreVersion) { throw 'MSIX version does not match the source version.' }
          if ($four -match '^0\.') { throw "版本号第一段不能为 0：$four（商店要求 >= 1.0.0.0）" }

          "version=$four" >> $env:GITHUB_OUTPUT
          "semver=" + ($p[0..2] -join '.') >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "MSIX 版本 = $four（来源：$src）"

      - name: 回归测试
        run: cargo test --release --locked

      - name: cargo build --release
        env:
          ROG_BUILD_VERSION: ${{ steps.ver.outputs.semver }}
        run: cargo build --release --locked

      - name: 定位 makeappx
        shell: pwsh
        run: |
          $mk = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter makeappx.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\makeappx\.exe$' } |
                Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mk) { throw '找不到 makeappx.exe —— runner 上没有 Windows SDK？' }
          Write-Host "makeappx: $($mk.FullName)"
          $mk.DirectoryName >> $env:GITHUB_PATH

      - name: 打 MSIX（含逐项自检）
        shell: pwsh
        run: ./msix/build-msix.ps1 -Version ${{ steps.ver.outputs.version }} -Verify -SkipInstalledVersionCheck

      - name: 打 msixupload（商店提交件）
        shell: pwsh
        run: ./msix/make-upload.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: 汇总产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "msix\AppPackages\*_${{ steps.ver.outputs.version }}_x64.msix" dist\
          Copy-Item "msix\AppPackages\*_${{ steps.ver.outputs.version }}_x64.msixupload" dist\
          Get-ChildItem dist | ForEach-Object { '{0}  {1:N0} B' -f $_.Name, $_.Length }

      - uses: actions/upload-artifact@v4
        with:
          name: msix-${{ steps.ver.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: 上传并提交到商店
        if: vars.MSSTORE_PRODUCT_ID != ''
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $up = Get-ChildItem dist\*.msixupload | Select-Object -First 1
          if (-not $up) { throw 'dist 里没有 .msixupload，先确认上一步成功' }
          ./tools/msstore-publish.ps1 -ProductId '${{ vars.MSSTORE_PRODUCT_ID }}' -PackagePath $up.FullName

      - name: 商店提交状态
        if: vars.MSSTORE_PRODUCT_ID != ''
        shell: pwsh
        run: |
          Write-Host '包已提交，最终上架状态以 Partner Center 为准。'
          Write-Host '状态页：https://partner.microsoft.com/dashboard/products/${{ vars.MSSTORE_PRODUCT_ID }}/submissions'
