[package]
name = "x-battery"
version = "1.5.1"
edition = "2021"
default-run = "x-battery"
description = "Peripheral battery monitor and ROG mouse settings utility for Windows"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
windows = { version = "0.61.3", features = [
    "ApplicationModel", "Services_Store", "Win32_Foundation", "Data_Xml_Dom", "UI_Notifications",
    "Win32_System_Recovery", "Win32_System_WinRT", "Win32_UI_Shell",
    "Win32_Storage_Packaging_Appx", "Win32_System_Com",
] }
windows-collections = "0.2.0"
windows-future = "0.2.1"
native-windows-gui = { version = "1.0.13", default-features = false, features = [
    "tabs", "tray-notification", "message-window", "cursor", "menu",
    "progress-bar", "trackbar", "combobox", "animation-timer", "notice",
    "image-decoder", "file-dialog", "frame", "textbox", "clipboard",
] }
winapi = { version = "0.3.9", features = [
    "combaseapi", "endpointvolume", "functiondiscoverykeys_devpkey",
    "mmdeviceapi", "objbase", "propidl", "propsys", "winbase", "hidpi", "hidclass", "xinput", "cfgmgr32",
    "winhttp", "wincrypt", "bcrypt", "dpapi",
] }

[[bin]]
name = "x-battery"
path = "src/main.rs"

[[bin]]
name = "x-battery-startup"
path = "src/startup_launcher.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
