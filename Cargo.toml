[package]
name = "rog-mouse-ctl"
version = "1.4.3"
edition = "2021"
description = "ROG peripheral battery monitor and mouse settings utility for Windows"

[dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = [
    "tabs", "tray-notification", "message-window", "cursor", "menu",
    "progress-bar", "trackbar", "combobox", "animation-timer", "notice",
    "image-decoder", "file-dialog",
] }
winapi = { version = "0.3.9", features = [
    "combaseapi", "endpointvolume", "functiondiscoverykeys_devpkey",
    "mmdeviceapi", "objbase", "propidl", "propsys", "winbase",
] }

[[bin]]
name = "rog-mouse-ctl"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
