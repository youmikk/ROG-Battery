[package]
name = "rog-mouse-ctl"
version = "1.4.8"
edition = "2021"
description = "Peripheral battery monitor and ROG mouse settings utility for Windows"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
native-windows-gui = { version = "1.0.13", default-features = false, features = [
    "tabs", "tray-notification", "message-window", "cursor", "menu",
    "progress-bar", "trackbar", "combobox", "animation-timer", "notice",
    "image-decoder", "file-dialog", "frame", "textbox", "clipboard",
] }
winapi = { version = "0.3.9", features = [
    "combaseapi", "endpointvolume", "functiondiscoverykeys_devpkey",
    "mmdeviceapi", "objbase", "propidl", "propsys", "winbase", "hidpi", "hidclass", "xinput", "cfgmgr32",
    "winhttp", "wincrypt", "bcrypt", "dpapi",
] }

[[bin]]
name = "rog-mouse-ctl"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
